<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖咭排序遊戲(初階)</title>
  <!-- Google Fonts for friendly rounded text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Canvas Confetti for winning effect -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --primary: #4F46E5;
      --primary-light: #EEF2FF;
      --secondary: #06B6D4;
      --accent-yellow: #F59E0B;
      --accent-green: #10B981;
      --accent-red: #EF4444;
      --bg-color: #F0F9FF;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --border-radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Noto Sans TC', 'Fredoka', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      padding: 15px 25px;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
      border: 3px solid #E0F2FE;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .teacher-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
    }

    .teacher-btn:hover {
      transform: translateY(-2px);
      background: #4338CA;
    }

    .main-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* Section Styling */
    .section-box {
      background: white;
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.04);
      border: 3px solid #E2E8F0;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px dashed #E2E8F0;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Teacher Edit Panel */
    #teacherPanel {
      display: none;
      background: #FFFBEB;
      border-color: #FDE68A;
      animation: fadeIn 0.3s ease;
    }

    .teacher-slots {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .slot-editor {
      background: white;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #FCD34D;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slot-editor label {
      font-weight: 700;
      color: #92400E;
    }

    .file-input-btn {
      background: #F3F4F6;
      border: 2px dashed #9CA3AF;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 0.9rem;
      color: #4B5563;
      transition: background 0.2s;
    }

    .file-input-btn:hover {
      background: #E5E7EB;
    }

    .text-input {
      width: 100%;
      padding: 8px 12px;
      border: 2px solid #CBD5E1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      font-family: inherit;
    }

    .text-input:focus {
      border-color: var(--primary);
    }

    .demo-btn-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .save-status-tag {
      color: #059669;
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-secondary {
      background: #10B981;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    /* Order Area (排序區) */
    .order-actions {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background: var(--primary-light);
      color: var(--primary);
      border: 2px solid var(--primary);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: var(--primary);
      color: white;
    }

    .order-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      min-height: 260px;
    }

    .arrow {
      font-size: 2rem;
      color: #94A3B8;
      font-weight: bold;
      text-align: center;
    }

    .drop-box {
      background: #F8FAFC;
      border: 3px dashed #CBD5E1;
      border-radius: 16px;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.2s ease;
      padding: 10px;
    }

    .drop-box.drag-over {
      background: #EEF2FF;
      border-color: var(--primary);
      transform: scale(1.02);
    }

    .box-label {
      position: absolute;
      top: 8px;
      left: 12px;
      background: #E2E8F0;
      color: #475569;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* Wrong order blinking warning */
    .drop-box.wrong-flash {
      animation: flashRed 0.6s infinite ease-in-out;
      border: 3px solid var(--accent-red) !important;
    }

    @keyframes flashRed {
      0%, 100% {
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
        border-color: #EF4444;
      }
      50% {
        box-shadow: 0 0 2px rgba(239, 68, 68, 0.2);
        border-color: #FCA5A5;
      }
    }

    /* Card Pool Area (圖咭區) */
    .pool-grid {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
    }

    /* Card Item (圖咭) - Full width in pool area */
    .card-item {
      width: 100%;
